<style id="critical-layout">
/* ============================================================
   治理配置 Hi-Fi — Shared Project Shell (Critical Layout CSS)
   Static CSS — no Tailwind runtime dependency.
   All tokens reference project-local colors_and_type.css (--gc-* prefix).
   Viewport: 1920×1080 desktop, app-shell mode.
   ============================================================ */

/* ---- Shell grid ---- */
.gc-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--gc-bg);
  font-family: var(--gc-font-sans);
  color: var(--gc-text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---- Topbar (56px fixed) ---- */
.gc-shell-topbar {
  height: 56px;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--gc-panel);
  border-bottom: 1px solid var(--gc-line);
  position: relative;
  z-index: 20;
  flex-shrink: 0;
}

.gc-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.gc-topbar-brand {
  font-size: 15px;
  font-weight: 600;
  color: var(--gc-text);
  white-space: nowrap;
  letter-spacing: -0.01em;
}

.gc-topbar-center {
  display: flex;
  align-items: center;
  gap: 4px;
}
.gc-top-tab {
  display: inline-flex;
  align-items: center;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 400;
  color: var(--gc-muted);
  text-decoration: none;
  border-radius: var(--gc-radius-small);
  transition: color 0.15s cubic-bezier(.2,.8,.2,1), background-color 0.15s cubic-bezier(.2,.8,.2,1);
  white-space: nowrap;
}
.gc-top-tab:hover {
  color: var(--gc-text);
  background: var(--gc-bg-hover);
}
.gc-top-tab:focus-visible {
  outline: 2px solid var(--gc-accent);
  outline-offset: -2px;
}
.gc-top-tab--active {
  background: var(--gc-accent-soft);
  color: var(--gc-accent);
  font-weight: 600;
}
.gc-top-tab--active:hover {
  background: var(--gc-accent-soft);
  color: var(--gc-accent);
}

.gc-topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.gc-role-switch {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  font-size: 12px;
  color: var(--gc-muted);
  background: transparent;
  border: 1px solid var(--gc-line);
  border-radius: var(--gc-radius-small);
  cursor: pointer;
  transition: color 0.15s cubic-bezier(.2,.8,.2,1), border-color 0.15s cubic-bezier(.2,.8,.2,1);
  font-family: inherit;
}
.gc-role-switch:hover {
  color: var(--gc-text);
  border-color: var(--gc-line-strong);
}
.gc-role-switch:focus-visible {
  outline: 2px solid var(--gc-accent);
  outline-offset: -1px;
}
.gc-role-switch .gc-caret {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}

.gc-identity-badge {
  display: inline-flex;
  align-items: center;
  border-radius: 9999px;
  background: var(--gc-accent-soft);
  color: var(--gc-accent);
  font-size: 12px;
  font-weight: 500;
  padding: 2px 10px;
  white-space: nowrap;
}

/* ---- Shell body (sidebar + workspace) ---- */
.gc-shell-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ---- Sidebar (380px fixed) ---- */
.gc-shell-sidebar {
  width: 300px;
  min-width: 300px;
  display: flex;
  flex-direction: column;
  background: var(--gc-panel);
  border-right: 1px solid var(--gc-line);
  overflow: hidden;
  flex-shrink: 0;
}

.gc-sidebar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--gc-line);
  flex-shrink: 0;
}
.gc-sidebar-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.gc-sidebar-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--gc-text);
  margin: 0;
  letter-spacing: -0.01em;
}
.gc-version-badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 500;
  color: var(--gc-func-green);
  background: var(--gc-func-green-soft);
  border-radius: 9999px;
  padding: 2px 8px;
  white-space: nowrap;
}

.gc-shell-sidebar-nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 0 8px;
}

.gc-nav-group {
  margin-bottom: 2px;
}
.gc-nav-group-title {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 20px 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.gc-nav-group-dot {
  width: 6px;
  height: 6px;
  border-radius: 9999px;
  flex-shrink: 0;
}

.gc-nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px 10px 16px;
  min-height: 40px;
  text-decoration: none;
  color: var(--gc-text);
  position: relative;
  transition: background-color 0.15s cubic-bezier(.2,.8,.2,1);
}
.gc-nav-item:hover {
  background: var(--gc-bg-hover);
}
.gc-nav-item:focus-visible {
  outline: 2px solid var(--gc-accent);
  outline-offset: -2px;
}
.gc-nav-bar {
  width: 4px;
  height: 16px;
  border-radius: 2px;
  background: transparent;
  flex-shrink: 0;
  transition: background-color 0.15s cubic-bezier(.2,.8,.2,1);
}
.gc-nav-item--active {
  background: var(--gc-bg-active);
  font-weight: 600;
}
.gc-nav-item--active .gc-nav-bar {
  background: var(--gc-accent);
}
.gc-nav-label {
  flex: 1;
  font-size: 13px;
  line-height: 1.4;
}

.gc-nav-badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 500;
  border-radius: 9999px;
  padding: 1px 8px;
  white-space: nowrap;
  flex-shrink: 0;
}
.gc-badge-published {
  color: var(--gc-func-green);
  background: var(--gc-func-green-soft);
}
.gc-badge-draft {
  color: var(--gc-func-orange);
  background: var(--gc-func-orange-soft);
}

/* ---- Workspace (flex-1) ---- */
.gc-shell-workspace {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--gc-bg);
  min-width: 0;
}

.gc-workspace-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  padding: 20px 24px 16px;
  background: var(--gc-panel);
  border-bottom: 1px solid var(--gc-line);
  flex-shrink: 0;
}
.gc-workspace-header-main {
  flex: 1;
  min-width: 0;
}
.gc-workspace-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.gc-workspace-banner-slot {
  flex-shrink: 0;
}

.gc-shell-workspace-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 24px;
}

.gc-shell-footer {
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  padding: 12px 24px;
  background: var(--gc-panel);
  border-top: 1px solid var(--gc-line);
  flex-shrink: 0;
}

/* ---- Scrollbar styling (sidebar + workspace) ---- */
.gc-shell-sidebar-nav::-webkit-scrollbar,
.gc-shell-workspace-scroll::-webkit-scrollbar {
  width: 6px;
}
.gc-shell-sidebar-nav::-webkit-scrollbar-thumb,
.gc-shell-workspace-scroll::-webkit-scrollbar-thumb {
  background: var(--gc-line-strong);
  border-radius: 3px;
}
.gc-shell-sidebar-nav::-webkit-scrollbar-track,
.gc-shell-workspace-scroll::-webkit-scrollbar-track {
  background: transparent;
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  .gc-top-tab,
  .gc-nav-item,
  .gc-nav-bar,
  .gc-role-switch {
    transition: none;
  }
}
</style>
