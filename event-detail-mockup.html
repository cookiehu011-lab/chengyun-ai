<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>城运AI · 实时识别审核 — 事件详情效果图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    color: #1F2733;
    background: #F3F5F9;
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: relative; width: 1440px; height: 900px; overflow: hidden; }

  /* ───── 顶栏 ───── */
  .topbar {
    height: 48px; background: #fff; border-bottom: 1px solid #E8ECF2;
    display: flex; align-items: center; padding: 0 16px; gap: 10px;
  }
  .logo-en { color: #2F6BFF; font-weight: 800; font-size: 17px; font-style: italic; letter-spacing: 0.2px; }
  .logo-dot { color: #E45E58; font-weight: 900; margin: 0 2px; }
  .logo-cn { color: #1F2733; font-weight: 700; font-size: 15px; }
  .topbar .spacer { flex: 1; }
  .phone-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid #E3E8EF; background: #fff;
    display: flex; align-items: center; justify-content: center; color: #6B7688;
  }
  .org-pill {
    height: 30px; padding: 0 12px; border-radius: 15px; background: #232E4A; color: #fff;
    font-size: 12px; display: flex; align-items: center; gap: 8px;
  }
  .caret { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; opacity: 0.9; }
  .caret.gray { border-top-color: #98A2B3; }

  /* ───── 布局 ───── */
  .layout { display: flex; height: 852px; }
  .sidebar {
    width: 56px; background: #fff; border-right: 1px solid #E8ECF2;
    display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; flex-shrink: 0;
  }
  .side-icon {
    width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: #98A2B3;
  }
  .side-icon.active { background: #2F6BFF; color: #fff; box-shadow: 0 4px 10px rgba(47,107,255,0.35); }
  .side-bottom { margin-top: auto; }

  .main { flex: 1; padding: 14px 470px 12px 14px; display: flex; flex-direction: column; min-width: 0; }
  .filters { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  .f-input {
    width: 220px; height: 32px; border: 1px solid #E3E8EF; border-radius: 6px; background: #fff;
    font-size: 12.5px; color: #4A5568; padding: 0 10px; display: flex; align-items: center;
  }
  .f-input .ph { color: #A6AFBD; }
  .f-select {
    height: 32px; border: 1px solid #E3E8EF; border-radius: 6px; background: #fff;
    font-size: 12.5px; color: #4A5568; padding: 0 10px; display: flex; align-items: center; gap: 18px;
  }
  .f-select.w1 { width: 96px; } .f-select.w2 { width: 110px; }
  .f-select .txt { flex: 1; }
  .gear-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid #E3E8EF; background: #fff;
    display: flex; align-items: center; justify-content: center; color: #6B7688; margin-left: auto;
  }

  .table-card {
    flex: 1; background: #fff; border: 1px solid #EDF0F5; border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(22,45,77,0.04);
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    height: 38px; background: #F7F9FC; color: #8A94A6; font-size: 12px; font-weight: 600; text-align: left;
    padding: 0 12px; border-bottom: 1px solid #EDF0F5;
  }
  tbody td { height: 37px; font-size: 12.5px; color: #3A4353; padding: 0 12px; border-bottom: 1px solid #F3F5F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr.selected { background: #F0F5FF; box-shadow: inset 3px 0 0 #2F6BFF; }
  tbody tr.selected td:first-child { color: #2F6BFF; font-weight: 700; }
  col.c-no { width: 56px; } col.c-type { width: 112px; } col.c-loc { width: auto; }
  col.c-st1 { width: 100px; } col.c-st2 { width: 104px; } col.c-st3 { width: 104px; }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1;
    padding: 4px 8px; border-radius: 4px; font-weight: 500;
  }
  .chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .c-red { color: #D54941; background: #FDEDEC; }
  .c-green { color: #1E9E74; background: #E8F7F0; }
  .c-gray { color: #8A94A6; background: #F1F3F7; }

  .pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 4px 0; color: #6B7688; font-size: 12px; }
  .pg-btn { width: 22px; height: 22px; border: 1px solid #E3E8EF; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; color: #98A2B3; font-size: 12px; }
  .pg-num { min-width: 22px; height: 22px; border-radius: 4px; background: #2F6BFF; color: #fff; display: flex; align-items: center; justify-content: center; }

  /* ───── 抽屉 ───── */
  .drawer {
    position: absolute; top: 48px; right: 0; bottom: 0; width: 440px;
    background: #fff; border-left: 1px solid #E8ECF2; box-shadow: -8px 0 24px rgba(22,45,77,0.08);
    display: flex; flex-direction: column; z-index: 5;
  }
  .peek {
    position: absolute; right: 444px; top: 300px; width: 26px; height: 44px;
    background: #fff; border: 1px solid #E8ECF2; border-right: none; border-radius: 8px 0 0 8px;
    display: flex; align-items: center; justify-content: center; color: #98A2B3; box-shadow: -4px 0 10px rgba(22,45,77,0.06); z-index: 4;
  }
  .d-head { padding: 13px 16px 11px; border-bottom: 1px solid #EDF0F5; display: flex; gap: 10px; }
  .d-title { flex: 1; font-size: 15px; font-weight: 700; line-height: 1.4; color: #1F2733; }
  .d-id-line { margin-top: 4px; font-size: 12px; color: #8A94A6; font-weight: 500; }
  .d-id-line b { color: #4A5568; font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
  .d-close { color: #E45E58; font-size: 12px; font-weight: 600; height: 22px; flex-shrink: 0; padding: 2px 4px; }

  .d-media { flex-shrink: 0; }
  .shot { height: 168px; background: #10141B; position: relative; overflow: hidden; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot .cam-tag {
    position: absolute; top: 8px; left: 8px; background: rgba(16,20,27,0.72); color: #fff;
    font-size: 10px; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.3px;
  }
  .shot .rec { position: absolute; top: 9px; right: 10px; display: flex; align-items: center; gap: 4px; color: #FF6B62; font-size: 10px; font-weight: 700; }
  .shot .rec i { width: 6px; height: 6px; border-radius: 50%; background: #FF6B62; }
  .img-tabs { display: flex; height: 32px; }
  .img-tabs .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #C9D0DB; background: #2A2F3A; }
  .img-tabs .tab.active { background: #2F6BFF; color: #fff; font-weight: 700; }
  .img-tabs .tab + .tab { border-left: 1px solid rgba(255,255,255,0.08); }

  .d-body { flex: 1; overflow: hidden; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .sec-title { font-size: 13px; font-weight: 700; color: #1F2733; margin-bottom: 8px; }

  .loc-card { border: 1px solid #E6EAF0; border-radius: 8px; padding: 9px; display: flex; gap: 10px; align-items: center; }
  .map-thumb { width: 68px; height: 52px; border-radius: 6px; overflow: hidden; flex-shrink: 0; border: 1px solid #E6EAF0; }
  .addr { font-size: 12px; color: #4A5568; line-height: 1.55; }

  .info-card { border: 1px solid #E6EAF0; border-radius: 8px; padding: 2px 0; }
  .info-row { display: flex; align-items: center; padding: 7px 12px; }
  .info-row + .info-row { border-top: 1px solid #F3F5F9; }
  .info-row .k { width: 72px; flex-shrink: 0; font-size: 12px; color: #8A94A6; text-align: right; margin-right: 14px; }
  .info-row .v { font-size: 12px; color: #1F2733; font-weight: 500; }
  .info-row .v.mono { font-family: "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.2px; }

  .ai-box { border: 1px solid #F0B37E; background: #FFF9F2; border-radius: 8px; padding: 9px 11px; }
  .ai-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #E07B00; margin-bottom: 5px; }
  .ai-text { font-size: 12px; color: #3A4353; line-height: 1.6; }

  .radio-row { display: flex; gap: 26px; align-items: center; margin-bottom: 9px; }
  .radio { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #1F2733; }
  .radio i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #C4CCD8; display: inline-block; position: relative; }
  .radio.on i { border-color: #2F6BFF; }
  .radio.on i::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: #2F6BFF; }
  .rm-label { font-size: 12px; color: #4A5568; margin-bottom: 6px; }
  .remark {
    height: 52px; border: 1px solid #DDE3EC; border-radius: 6px; padding: 8px 10px;
    font-size: 12px; color: #A6AFBD;
  }

  .d-foot { padding: 11px 14px; border-top: 1px solid #EDF0F5; display: flex; gap: 10px; flex-shrink: 0; }
  .btn { height: 32px; padding: 0 18px; border-radius: 6px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .btn-primary { background: #2F6BFF; color: #fff; box-shadow: 0 4px 10px rgba(47,107,255,0.28); }
  .btn-ghost { background: #F2F4F8; color: #4A5568; }
</style>
</head>
<body>
<div class="frame">

  <!-- 顶栏 -->
  <div class="topbar">
    <span class="logo-en">See Time</span><span class="logo-dot">·</span><span class="logo-cn">城运AI</span>

    <!-- 主区 -->

        <div class="f-select w1"><span class="txt">发生中</span><span class="caret gray"></span></div>

<script>
  // ── 列表数据 ──
  var ROWS = [
    ["乱堆物料", "朝阳门街道-芳嘉园胡同6号楼芳嘉园胡同6号楼(南约18米)", "待审核", "待同步", true],
    ["乱堆物料", "景山街道-连丰胡同15号住宅附近", "待审核", "待同步"],
    ["生活垃圾", "永定门街道-西革新里104号院内西侧", "有效", "已同步"],
    ["沿街悬挂", "体育馆路街道-永生巷18号附近", "待审核", "待同步"],
    ["生活垃圾", "安定门街道-交道口北三条38号(南约17米)", "待审核", "待同步"],
    ["垃圾满溢", "安定门街道-东绦胡同9号住宅附近", "待审核", "待同步"],
    ["乱堆物料", "体育馆路街道-东唐街9号附近", "待审核", "待同步"],
    ["生活垃圾", "永定门街道-西革新里7号楼东侧", "待审核", "待同步"],
    ["生活垃圾", "永定门街道-宝华里平房区", "有效", "不适用"],
    ["沿街悬挂", "北新桥街道-青龙胡同10号嘉德小区附近", "待审核", "待同步"],
    ["非机动车乱停", "安定门街道-交道口北二条31号北京市第六医院急诊部(西北约15米)", "待审核", "待同步"],
    ["垃圾满溢", "永定门街道-西革新里104号院内西侧", "有效", "已同步"],
    ["非机动车乱停", "龙潭街道-幸福南街5号培新街北侧(北约27米)", "待审核", "待同步"],
    ["生活垃圾", "永定门街道-革新南路2号楼西侧", "有效", "已同步"],
    ["生活垃圾", "东四街道-月光胡同10号住宅附近", "待审核", "待同步"],
    ["沿街悬挂", "朝阳门街道-礼士胡同11号中国科学院宿舍附近", "待审核", "待同步"]
  ];

  var WARN = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 23 21H1L12 2.5z"/><rect x="11.1" y="9.5" width="1.8" height="6" rx="0.9" fill="#FDEDEC"/><circle cx="12" cy="17.8" r="1.1" fill="#FDEDEC"/></svg>';

  function chip(text) {
    var cls = "chip ";
    if (text === "发生中") return '<span class="chip c-red">' + WARN + text + "</span>";
    if (text === "待审核" || text === "待同步") return '<span class="chip c-red"><span class="dot"></span>' + text + "</span>";
    if (text === "有效" || text === "已同步") return '<span class="chip c-green"><span class="dot"></span>' + text + "</span>";
    return '<span class="chip c-gray"><span class="dot"></span>' + text + "</span>";
  }

  document.getElementById("tb").innerHTML = ROWS.map(function (r, i) {
    return '<tr' + (r[4] ? ' class="selected"' : '') + '>'
      + "<td>" + (i + 1) + "</td>"
      + "<td>" + r[0] + "</td>"
      + "<td>" + r[1] + "</td>"
      + "<td>" + chip("发生中") + "</td>"
      + "<td>" + chip(r[2]) + "</td>"
      + "<td>" + chip(r[3]) + "</td>"
      + "</tr>";
  }).join("");

  // ── 两种方案 ──
  var v = new URLSearchParams(location.search).get("v") || "a";
  var EVENT_ID = "DC-20261013-0007";

  var infoRows = [];
  if (v === "a") {
    // 方案一：事件编号放在「基本信息」第一行
    infoRows.push(["事件编号", EVENT_ID, true]);
  } else {
    // 方案二：事件编号放在抽屉标题正下方（标题列纵向排列）
    var head = document.querySelector(".d-head");
    var col = document.createElement("div");
    col.style.cssText = "flex:1;display:flex;flex-direction:column;min-width:0;";
    head.insertBefore(col, head.firstChild);
    col.appendChild(document.getElementById("dTitle"));
    var line = document.createElement("div");
    line.className = "d-id-line";
    line.innerHTML = "事件编号：<b>" + EVENT_ID + "</b>";
    col.appendChild(line);
  }
  infoRows = infoRows.concat([
    ["事件类型", "乱堆物料"],
    ["事件状态", "发生中"],
    ["发生时间", "2026-10-13 09:51:24"],
    ["持续时间", "0小时14分钟"]
  ]);

  document.getElementById("infoCard").innerHTML = infoRows.map(function (r, i) {
    return '<div class="info-row"' + (i ? ' style="border-top:1px solid #F3F5F9"' : '') + '>'
      + '<span class="k">' + r[0] + '</span>'
      + '<span class="v' + (r[2] ? " mono" : "") + '">' + r[1] + "</span>"
      + "</div>";
  }).join("");
</script>
</body>
</html>
